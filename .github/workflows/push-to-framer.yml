# This workflow will push meta data to framer

name: Framer sync

on:
  pull_request:
    types:
      - closed
    branches: [main]

jobs:
  if_merged:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      COLLECTION_ID: ${{ secrets.COLLECTION_ID }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run push-to-framer
